<!-- Panel chat -->
@if (open()) {
  <div
    class="fixed bottom-24 right-4 z-50 flex h-[28rem] w-[22rem] max-w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl"
  >
    <!-- Header -->
    <div class="flex items-center gap-3 bg-gradient-to-r from-brand-600 to-ocean-600 px-4 py-3 text-white">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
        </svg>
      </span>
      <div class="flex-1">
        <p class="text-sm font-bold">PFM AI Bot</p>
        <p class="text-[11px] text-ocean-100">Trợ lý tài chính thông minh</p>
      </div>
      <button type="button" (click)="toggle()" class="rounded-lg p-1 transition hover:bg-white/15" aria-label="Đóng">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <p-scrollpanel styleClass="bg-slate-50" [style]="{ height: '20rem' }">
      <div class="space-y-3 p-4">
        @for (msg of messages(); track $index) {
          <div class="flex" [class.justify-end]="msg.from === 'user'">
            <div
              class="max-w-[80%] rounded-2xl px-3.5 py-2 text-[13px] leading-snug shadow-sm"
              [class.bg-gradient-to-r]="msg.from === 'user'"
              [class.from-brand-600]="msg.from === 'user'"
              [class.to-ocean-600]="msg.from === 'user'"
              [class.text-white]="msg.from === 'user'"
              [class.bg-white]="msg.from === 'bot'"
              [class.text-slate-700]="msg.from === 'bot'"
            >
              {{ msg.text }}
            </div>
          </div>
        }
      </div>
    </p-scrollpanel>

    <!-- Input -->
    <div class="flex items-center gap-2 border-t border-slate-200 p-3">
      <input
        pInputText
        [(ngModel)]="input"
        (keyup.enter)="send()"
        placeholder="Nhập câu hỏi..."
        class="!h-10 flex-1 !w-full !rounded-full !border-slate-200 !bg-slate-50 !px-4 !text-sm"
      />
      <p-button
        icon="pi pi-send"
        [rounded]="true"
        styleClass="!h-10 !w-10 !bg-gradient-to-r !from-brand-600 !to-ocean-600 !text-white"
        (onClick)="send()"
        ariaLabel="Gửi"
      />
    </div>
  </div>
}

<!-- Nút nổi -->
<p-button
  [rounded]="true"
  [icon]="open() ? 'pi pi-times' : 'pi pi-comment'"
  styleClass="!fixed !bottom-5 !right-5 !z-50 !h-14 !w-14 !bg-gradient-to-br !from-brand-500 !to-ocean-600 !text-white !shadow-lg"
  (onClick)="toggle()"
  ariaLabel="PFM AI Bot"
/>
