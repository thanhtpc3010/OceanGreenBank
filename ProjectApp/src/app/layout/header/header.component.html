<header
  class="relative z-30 flex h-14 shrink-0 items-center gap-3 bg-gradient-to-r from-brand-700 via-brand-600 to-ocean-600 px-3 text-white shadow-lg shadow-brand-900/10 lg:px-5"
>
  <!-- Hamburger (mobile) -->
  <button
    type="button"
    (click)="menuToggle.emit()"
    class="flex h-10 w-10 items-center justify-center rounded-lg transition hover:bg-white/15 lg:hidden"
    aria-label="Menu"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- Logo -->
  <a href="/" class="flex items-center gap-2.5">
    <span
      class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/95 shadow-inner"
      aria-hidden="true"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-600" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2 2 19h20L12 2Zm0 5 5 10h-3l-2-4-2 4H7l5-10Z" />
      </svg>
    </span>
    <span class="hidden text-base font-bold tracking-wide sm:block">
      Smart<span class="font-extrabold text-ocean-200">Bank</span>
    </span>
  </a>

  <div class="flex-1"></div>

  <!-- Số dư -->
  <div class="hidden items-center gap-2 rounded-full bg-white/15 px-4 py-1.5 backdrop-blur sm:flex">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-ocean-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
    </svg>
    <div class="text-right leading-tight">
      <p class="text-[11px] text-ocean-100">Số dư tài khoản</p>
      <p class="text-sm font-bold">{{ balance() | number : '1.0-0' }} VND</p>
    </div>
  </div>

  <!-- Notification -->
  <button
    type="button"
    class="relative flex h-10 w-10 items-center justify-center rounded-full transition hover:bg-white/15"
    aria-label="Thông báo"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
    </svg>
    @if (notificationCount() > 0) {
      <span
        class="absolute -right-0.5 -top-0.5 flex h-5 min-w-5 items-center justify-center rounded-full bg-rose-500 px-1 text-[11px] font-bold text-white ring-2 ring-brand-600"
      >
        {{ notificationCount() }}
      </span>
    }
  </button>

  <!-- User profile -->
  <div class="flex items-center gap-2.5 rounded-full bg-white/10 py-1 pl-1 pr-3 transition hover:bg-white/15">
    <span
      class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-ocean-400 to-ocean-600 text-sm font-bold text-white"
    >
      {{ userName().charAt(0) }}
    </span>
    <div class="hidden leading-tight md:block">
      <p class="text-sm font-semibold">{{ userName() }}</p>
      <p class="text-[11px] text-ocean-100">{{ userEmail() }}</p>
    </div>
    <svg xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4 text-ocean-200 md:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </div>

  <!-- Logout -->
  <button
    type="button"
    (click)="logout()"
    class="flex h-9 w-9 items-center justify-center rounded-lg transition hover:bg-white/15"
    aria-label="Đăng xuất"
    title="Đăng xuất"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
    </svg>
  </button>
</header>
