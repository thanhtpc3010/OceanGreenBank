@if (state(); as s) {
  <div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm"
    (click)="cancel()"
  >
    <div
      class="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
    >
      <!-- Header -->
      <div
        class="flex items-center gap-3 px-5 py-4"
        [class.bg-rose-50]="s.options.danger"
        [class.bg-brand-50]="!s.options.danger"
      >
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
          [class.bg-rose-100]="s.options.danger"
          [class.text-rose-600]="s.options.danger"
          [class.bg-brand-100]="!s.options.danger"
          [class.text-brand-600]="!s.options.danger"
        >
          @if (s.options.danger) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487 18.5 3.563a2.121 2.121 0 1 1 3 3L6.75 14.487 3 15.75l1.263-3.75L16.862 4.487Z" />
            </svg>
          }
        </span>
        <div>
          <h3 class="text-base font-bold text-slate-800">
            {{ s.options.title ?? (s.options.danger ? 'Xác nhận thao tác' : 'Xác nhận') }}
          </h3>
          <p class="text-xs text-slate-500">Thao tác này sẽ thay đổi dữ liệu</p>
        </div>
      </div>

      <!-- Body -->
      <div class="px-5 py-4">
        <p class="text-sm leading-relaxed text-slate-600">{{ s.options.message }}</p>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-5 py-4">
        <button
          type="button"
          (click)="cancel()"
          class="rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50"
        >
          {{ s.options.cancelText ?? 'Hủy' }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          class="rounded-xl px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-90"
          [class.bg-rose-600]="s.options.danger"
          [class.hover:bg-rose-700]="s.options.danger"
          [class.bg-gradient-to-r]="!s.options.danger"
          [class.from-brand-600]="!s.options.danger"
          [class.to-ocean-600]="!s.options.danger"
        >
          {{ s.options.confirmText ?? 'Xác nhận' }}
        </button>
      </div>
    </div>
  </div>
}
