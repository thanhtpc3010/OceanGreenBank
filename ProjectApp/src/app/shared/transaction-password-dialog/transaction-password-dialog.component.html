@if (state(); as s) {
  <div
    class="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm"
    (click)="cancel()"
  >
    <div
      class="w-full max-w-sm overflow-hidden rounded-2xl bg-white shadow-2xl"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
    >
      <!-- Header -->
      <div class="flex items-center gap-3 bg-brand-50 px-5 py-4">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-100 text-brand-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
        </span>
        <div>
          <h3 class="text-base font-bold text-slate-800">
            {{ s.options.title ?? ('PASSWORD.PIN_TITLE' | translate) }}
          </h3>
          <p class="text-xs text-slate-500">{{ 'PASSWORD.PIN_DESC' | translate }}</p>
        </div>
      </div>

      <!-- Body -->
      <div class="px-5 py-4">
        @if (s.options.message) {
          <p class="mb-3 rounded-xl bg-slate-50 px-3 py-2 text-sm leading-relaxed text-slate-600">
            {{ s.options.message }}
          </p>
        }

        <label class="mb-1.5 block text-sm font-semibold text-slate-700">
          {{ 'PASSWORD.PIN_LABEL' | translate }}
        </label>
        <input
          #pin
          type="password"
          inputmode="numeric"
          maxlength="6"
          pattern="[0-9]*"
          [(ngModel)]="password"
          (keyup.enter)="confirm()"
          placeholder="••••••"
          autocomplete="off"
          autofocus
          class="h-11 w-full rounded-xl border border-slate-200 bg-white px-4 text-center font-mono text-lg tracking-[0.4em] outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
        />
        @if (error()) {
          <p class="mt-1.5 text-xs text-rose-600">{{ error() }}</p>
        }
        <p class="mt-2 text-[11px] text-slate-400">
          {{ 'PASSWORD.PIN_HINT' | translate }}
        </p>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-5 py-4">
        <button
          type="button"
          (click)="cancel()"
          class="rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
          type="button"
          (click)="confirm()"
          class="rounded-xl bg-gradient-to-r from-brand-600 to-ocean-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-90"
        >
          {{ s.options.confirmText ?? ('COMMON.CONFIRM' | translate) }}
        </button>
      </div>
    </div>
  </div>
}
