<div class="mx-auto max-w-2xl space-y-4 p-3 lg:p-5">
  <!-- Page header -->
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-bold text-slate-800">Đổi mật khẩu</h1>
      <p class="text-sm text-slate-500">Bảo mật tài khoản của bạn</p>
    </div>
    <a
      routerLink="/account"
      class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2 text-sm font-semibold text-slate-600 shadow-sm ring-1 ring-slate-200 transition hover:bg-slate-50"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
      </svg>
      Quay lại
    </a>
  </div>

  <form
    (ngSubmit)="save()"
    class="space-y-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <!-- Thông báo -->
    @if (error()) {
      <div class="flex items-center gap-2 rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        {{ error() }}
      </div>
    }
    @if (success()) {
      <div class="flex items-center gap-2 rounded-xl bg-brand-50 px-4 py-3 text-sm text-brand-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
        {{ success() }}
      </div>
    }

    <div class="space-y-4">
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-slate-700">Mật khẩu hiện tại *</label>
        <input
          type="password"
          [(ngModel)]="current"
          name="current"
          required
          autocomplete="current-password"
          class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
        />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-slate-700">Mật khẩu mới *</label>
        <input
          type="password"
          [(ngModel)]="next"
          name="next"
          required
          autocomplete="new-password"
          placeholder="Ít nhất 8 ký tự"
          class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
        />
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-semibold text-slate-700">Xác nhận mật khẩu mới *</label>
        <input
          type="password"
          [(ngModel)]="confirm"
          name="confirm"
          required
          autocomplete="new-password"
          class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm outline-none transition focus:border-brand-400 focus:ring-2 focus:ring-brand-100"
        />
      </div>
    </div>

    <div class="rounded-xl border border-slate-100 bg-slate-50 p-4">
      <p class="text-xs font-semibold text-slate-600">Yêu cầu mật khẩu:</p>
      <ul class="mt-2 space-y-1 text-xs text-slate-500">
        <li>• Tối thiểu 8 ký tự</li>
        <li>• Không trùng với mật khẩu hiện tại</li>
        <li>• Nên kết hợp chữ hoa, chữ thường, số và ký tự đặc biệt</li>
      </ul>
    </div>

    <div class="flex items-center justify-end gap-2">
      <button
        type="button"
        routerLink="/account"
        class="rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 ring-1 ring-slate-200 transition hover:bg-slate-50"
      >
        Hủy
      </button>
      <button
        type="submit"
        [disabled]="saving()"
        class="rounded-xl bg-gradient-to-r from-brand-600 to-ocean-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:opacity-90 disabled:opacity-50"
      >
        {{ saving() ? 'Đang xử lý...' : 'Đổi mật khẩu' }}
      </button>
    </div>
  </form>
</div>
